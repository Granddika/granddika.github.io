backend:
  name: github
  repo: Granddika/granddika.github.io
  branch: main

locale: ru
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: portfolio
    label: Портфолио
    files:
      - name: projects
        label: Работы
        file: content/portfolio.json
        format: json
        fields:
          - label: Работы
            name: projects
            widget: list
            label_singular: Работа
            summary: "{{fields.title_ru}} — {{fields.category}}"
            fields:
              - { label: Идентификатор, name: id, widget: string, hint: "Латинскими буквами без пробелов, например perfume-video" }
              - { label: Показывать на сайте, name: published, widget: boolean, default: true }
              - label: Категория
                name: category
                widget: select
                options:
                  - { label: Клипы и сниппеты, value: clips }
                  - { label: Мультфильмы и сериалы, value: animation }
                  - { label: Вирусные ролики Reels/TikTok, value: viral }
                  - { label: Нейрофотосессии, value: photo }
                  - { label: Архив (видно только во «Всё»), value: archive }
              - { label: Название работы — RU, name: title_ru, widget: string }
              - { label: Project title — EN, name: title_en, widget: string }
              - { label: Подпись — RU, name: meta_ru, widget: string, required: false }
              - { label: Caption — EN, name: meta_en, widget: string, required: false }
              - { label: Описание изображения — RU, name: alt_ru, widget: string, required: false }
              - { label: Image description — EN, name: alt_en, widget: string, required: false }
              - { label: Обложка папки, name: media, widget: file, hint: "Картинка или видео на карточке. Если альбом пуст — открывается она.", media_library: { config: { multiple: false } } }
              - label: Тип файла
                name: media_type
                widget: select
                options:
                  - { label: Изображение, value: image }
                  - { label: Видео, value: video }
                default: image
              - label: Работы в папке (фото и видео)
                name: album
                widget: list
                required: false
                collapsed: true
                label_singular: Файл альбома
                summary: "{{fields.media}}"
                hint: "Работы внутри папки — все по порядку. Обложка сюда не входит: если нужна и она, добавь её сюда тоже."
                fields:
                  - { label: Фото или видео, name: media, widget: file, media_library: { config: { multiple: false } } }
                  - label: Тип файла
                    name: media_type
                    widget: select
                    options:
                      - { label: Изображение, value: image }
                      - { label: Видео, value: video }
                    default: image
                  - { label: Превью видео (картинка), name: poster, widget: image, required: false, hint: "Необязательно. Кадр, который видно в сетке папки до запуска видео." }
                  - { label: Описание — RU, name: alt_ru, widget: string, required: false }
                  - { label: Description — EN, name: alt_en, widget: string, required: false }
              - label: Размер карточки
                name: size
                widget: select
                options:
                  - { label: Обычная, value: standard }
                  - { label: Широкая, value: wide }
                  - { label: Большая, value: large }
                default: standard
              - label: Положение обложки в карточке
                name: cover_focus
                widget: select
                required: false
                hint: "Какую часть обложки показывать, если она не помещается целиком"
                options:
                  - { label: По центру, value: "50% 50%" }
                  - { label: Верх, value: "50% 15%" }
                  - { label: Самый верх, value: "50% 0%" }
                  - { label: Низ, value: "50% 85%" }
